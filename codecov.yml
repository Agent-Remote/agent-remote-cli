codecov:
  require_ci_to_pass: true

# UAC can only be exercised interactively on Windows; Windows CI still compiles
# this module and runs its argument/selection unit tests.
ignore:
  - "src/bin/agent-remote-wireguard/windows.rs"

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 5%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true

github_checks:
  annotations: true
