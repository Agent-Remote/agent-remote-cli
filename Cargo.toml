[package]
name = "agent-remote-cli"
version = "0.2.6"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Agent-Remote/agent-remote-cli"
description = "Local command line client for agent-remote."

[[bin]]
name = "agent-remote"
path = "src/main.rs"

[[bin]]
name = "agent-remote-wireguard"
path = "src/bin/agent-remote-wireguard.rs"

[[bin]]
name = "fclaude"
path = "src/bin/fclaude.rs"

[[bin]]
name = "agent-remote-scp"
path = "src/bin/agent-remote-scp.rs"

[[bin]]
name = "agent-remote-ssh"
path = "src/bin/agent-remote-ssh.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
h2 = "0.4"
http = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
sha1 = "0.10"
tokio = { version = "1.40", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
unicode-width = "0.2"
uuid = "1.18"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
security-framework = "=3.2.0"

[target.'cfg(windows)'.dependencies]
dunce = "1.0"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.12"
