name: install-smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: install-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            packaging:
              - '.github/workflows/install-smoke.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'packaging/**'
              - 'scripts/**'
              - 'src/**'
              - 'tests/install_smoke_test.*'

  install:
    name: install (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.packaging == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: install-smoke-${{ matrix.target }}
      - uses: actions/setup-go@v6
        if: runner.os != 'Windows'
        with:
          go-version: "1.24.x"
          cache: false
      - name: Install Unix build dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y autoconf automake build-essential bison pkg-config xz-utils
          else
            brew install automake pkg-config
          fi
      - name: Restore managed tool binaries
        if: runner.os != 'Windows'
        uses: actions/cache@v6.1.0
        with:
          path: .cache/managed-tools/${{ matrix.target }}
          key: managed-tools-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('scripts/build-managed-tools.sh') }}
      - name: Build and install Unix package
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGETS: ${{ matrix.target }}
          VERSION: 0.0.0-install-ci
          MANAGED_TOOLS_CACHE_DIR: ${{ github.workspace }}/.cache/managed-tools
        run: |
          scripts/package-release.sh
          package="$PWD/dist/agent-remote-cli-${VERSION}-${TARGETS}"
          install_home="$RUNNER_TEMP/agent-remote-home"
          link_dir="$RUNNER_TEMP/agent-remote-links"
          "$package/install.sh" \
            --home "$install_home" \
            --bin-dir "$link_dir"
          bash tests/install_smoke_test.sh \
            "$package" "$install_home" "$link_dir" "$VERSION"
      - name: Build and install Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @("scripts/install.ps1", "scripts/package-release.ps1", "tests/install_smoke_test.ps1")) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          $version = "0.0.0-install-ci"
          $target = "${{ matrix.target }}"
          ./scripts/package-release.ps1 -Version $version -Target $target
          $package = Join-Path $PWD "dist/agent-remote-cli-$version-$target"
          $installHome = Join-Path $env:RUNNER_TEMP "agent-remote-home"
          $wireGuardDirectory = Join-Path $installHome "wireguard"
          $wireGuardConfig = Join-Path $wireGuardDirectory "agent-remote.conf"
          New-Item -ItemType Directory -Force $wireGuardDirectory | Out-Null
          Set-Content -Path $wireGuardConfig -Value "[Interface]`nPrivateKey = install-smoke-test" -Encoding ascii
          $principal = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          & icacls.exe $wireGuardConfig /inheritance:r /grant:r "${principal}:(F)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Failed to prepare legacy WireGuard ACL" }
          & "$package/install.ps1" -AgentRemoteHome $installHome -NoPathUpdate -InstallPrerequisites
          ./tests/install_smoke_test.ps1 -PackageDirectory $package -InstallHome $installHome -ExpectedVersion $version
