# The broker owns a fixed system D-Bus name.  The service is intentionally
# root-only and is started by systemd, with D-Bus activation as a fallback.
<busconfig>
  <policy user="root">
    <allow own="dev.agentremote.WireGuardBroker"/>
  </policy>
  <policy context="default">
    <allow send_destination="dev.agentremote.WireGuardBroker"
           send_interface="dev.agentremote.WireGuardBroker1"
           send_member="Status"/>
    <allow send_destination="dev.agentremote.WireGuardBroker"
           send_interface="dev.agentremote.WireGuardBroker1"
           send_member="Execute"/>
  </policy>
</busconfig>
